<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QHI 印刷生产管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <div class="logo">Q</div>
        <h1 class="system-name">QHI 印刷生产管理系统</h1>
      </div>
      <div class="header-right">
        <span class="实时时间" id="current-time"></span>
        <div class="connection-status" id="connection-status">
          <span class="status-dot"></span>连接中...
        </div>
      </div>
    </header>

    <aside class="sidebar">
      <nav>
        <ul class="nav-menu">
          <li class="nav-item active" data-route="/dashboard">
            <span class="nav-icon">📊</span>
            <span>仪表盘</span>
          </li>
          <li class="nav-item" data-route="/orders">
            <span class="nav-icon">📋</span>
            <span>工单管理</span>
          </li>
          <li class="nav-item" data-route="/customers">
            <span class="nav-icon">👥</span>
            <span>客户管理</span>
          </li>
          <li class="nav-item" data-route="/stats">
            <span class="nav-icon">📈</span>
            <span>统计分析</span>
          </li>
          <li class="nav-item" data-route="/printers">
            <span class="nav-icon">🖨️</span>
            <span>打印机监控</span>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="main-content" id="main-content">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </main>

    <footer class="footer">
      <span>QHI 印刷生产管理系统 v2.0</span>
      <span>© 2024 QHI Digital Printing</span>
    </footer>
  </div>

  <aside class="detail-sidebar" id="detail-sidebar">
    <div class="detail-header">
      <h3>工单详情</h3>
      <button class="modal-close" onclick="document.getElementById('detail-sidebar').classList.remove('active')">×</button>
    </div>
    <div class="detail-content" id="detail-content"></div>
  </aside>

  <div class="modal-overlay" id="create-order-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">新建工单</h3>
        <button class="modal-close" onclick="app.hideCreateOrderModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">客户名称</label>
          <input type="text" class="form-input" id="order-customer" placeholder="请输入客户名称">
        </div>
        <div class="form-group">
          <label class="form-label">产品名称</label>
          <input type="text" class="form-input" id="order-product" placeholder="请输入产品名称">
        </div>
        <div class="form-group">
          <label class="form-label">数量</label>
          <input type="number" class="form-input" id="order-quantity" placeholder="请输入数量">
        </div>
        <div class="form-group">
          <label class="form-label">金额</label>
          <input type="number" class="form-input" id="order-amount" placeholder="请输入金额" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <input type="text" class="form-input" id="order-remark" placeholder="请输入备注">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="app.hideCreateOrderModal()">取消</button>
        <button class="btn btn-primary" onclick="app.submitCreateOrder()">创建</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
